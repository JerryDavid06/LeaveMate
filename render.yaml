services:
  - type: web
    name: leavemate-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
